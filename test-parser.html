<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Parser Test - Workday Auto-Fill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .upload-zone {
      border: 3px dashed #667eea;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9fa;
    }

    .upload-zone:hover {
      background: #e9ecef;
      border-color: #764ba2;
    }

    .upload-zone.dragging {
      background: #d4edff;
      border-color: #667eea;
      transform: scale(1.02);
    }

    .upload-zone input {
      display: none;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
      display: none;
    }

    .status.info {
      background: #e3f2fd;
      color: #1565c0;
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }

    .ai-status {
      padding: 15px;
      background: #fff3e0;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #ff9800;
    }

    .ai-status.ready {
      background: #e8f5e9;
      border-left-color: #4caf50;
    }

    .results {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-top: 20px;
    }

    .results h2 {
      color: #667eea;
      margin-bottom: 20px;
    }

    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    .json-key {
      color: #9cdcfe;
    }

    .json-string {
      color: #ce9178;
    }

    .json-number {
      color: #b5cea8;
    }

    .json-boolean {
      color: #569cd6;
    }

    .json-null {
      color: #569cd6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-card .label {
      font-size: 0.9em;
      opacity: 0.9;
    }

    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 Resume Parser Test</h1>

    <div class="ai-status" id="aiStatus">
      Checking Chrome AI availability...
    </div>

    <div class="cards">
      <div class="card">
        <h2>1️⃣ Upload Resume</h2>
        <div class="upload-zone" id="uploadZone">
          <div class="upload-icon">📄</div>
          <p><strong>Drop a resume here</strong></p>
          <p style="margin-top: 10px; color: #666;">or click to browse</p>
          <p style="margin-top: 10px; font-size: 14px; color: #999;">Supports PDF, DOC, DOCX, TXT</p>
          <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt">
        </div>
        <div class="status" id="uploadStatus"></div>
      </div>

      <div class="card">
        <h2>2️⃣ Quick Test</h2>
        <p style="margin-bottom: 15px; color: #666;">Test with sample resumes:</p>
        <button class="btn" onclick="loadSampleResume('workday')">Test: resume-workday.pdf</button>
        <button class="btn" onclick="loadSampleResume('zillow')">Test: resume-zillow-2.pdf</button>
        <div class="status" id="sampleStatus"></div>
      </div>
    </div>

    <div class="results" id="results" style="display: none;">
      <h2>✨ Parsed Results</h2>

      <div class="stats" id="stats"></div>

      <h3 style="margin-top: 30px; margin-bottom: 15px; color: #333;">Extracted Data:</h3>
      <pre id="jsonOutput"></pre>

      <h3 style="margin-top: 30px; margin-bottom: 15px; color: #333;">Raw Text (first 1000 chars):</h3>
      <pre id="rawText"></pre>
    </div>
  </div>

  <!-- Load PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Configure PDF.js worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Check Chrome AI availability
    checkAIAvailability();

    // Upload zone handlers
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragging');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragging');
    });

    uploadZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragging');
      const file = e.dataTransfer.files[0];
      if (file) {
        await processFile(file);
      }
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        await processFile(file);
      }
    });

    // Process uploaded file
    async function processFile(file) {
      showStatus('uploadStatus', `Processing ${file.name}...`, 'info');

      try {
        // Extract text
        const text = await extractText(file);
        showStatus('uploadStatus', `✅ Extracted ${text.length} characters`, 'success');

        // Parse with AI
        await parseResume(text, file.name);

      } catch (error) {
        showStatus('uploadStatus', `❌ Error: ${error.message}`, 'error');
        console.error(error);
      }
    }

    // Extract text from file
    async function extractText(file) {
      if (file.name.endsWith('.pdf')) {
        return await extractTextFromPDF(file);
      } else {
        return await readTextFile(file);
      }
    }

    // Read text file
    function readTextFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsText(file);
      });
    }

    // Extract text from PDF
    async function extractTextFromPDF(file) {
      return new Promise(async (resolve, reject) => {
        const reader = new FileReader();

        reader.onload = async (e) => {
          try {
            const arrayBuffer = e.target.result;
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(item => item.str).join(' ');
              fullText += pageText + '\n\n';
            }

            resolve(fullText.trim());
          } catch (error) {
            reject(error);
          }
        };

        reader.onerror = () => reject(new Error('Failed to read PDF'));
        reader.readAsArrayBuffer(file);
      });
    }

    // Parse resume with Chrome AI
    async function parseResume(text, filename) {
      showStatus('uploadStatus', '🤖 Parsing with Chrome AI...', 'info');

      try {
        if (!window.ai || !window.ai.languageModel) {
          throw new Error('Chrome AI not available. Using fallback parser.');
        }

        const session = await window.ai.languageModel.create({
          systemPrompt: `You are a resume parser. Extract structured data from resumes.
Return ONLY valid JSON with this exact structure. Use null for missing fields.

IMPORTANT RULES:
1. Normalize ALL dates to MM/YYYY format (e.g., "June 2020" → "06/2020")
2. Use "Present" for current positions
3. Extract FULL company names (expand abbreviations when clear)
4. Separate first and last names
5. Normalize US phone numbers to (XXX) XXX-XXXX format
6. Use 2-letter state codes for US addresses (CA, NY, TX, etc.)
7. Order work experience from most recent to oldest
8. For degrees, use full names: "Bachelor of Science" not "BS"
9. If information is missing, use null (not empty string)
10. Extract ALL work experience and education entries (not just the first)

{
  "personal": {
    "firstName": "string or null",
    "lastName": "string or null",
    "email": "string or null",
    "phone": "string or null",
    "city": "string or null",
    "state": "string (2-letter US code) or null",
    "zipCode": "string or null",
    "country": "string or null",
    "linkedin": "url or null",
    "github": "url or null",
    "portfolio": "url or null"
  },
  "summary": "string or null",
  "workExperience": [
    {
      "company": "string",
      "title": "string",
      "startDate": "MM/YYYY",
      "endDate": "MM/YYYY or Present",
      "location": "City, State or null",
      "employmentType": "Full-time|Part-time|Contract|Internship or null",
      "description": "string or null"
    }
  ],
  "education": [
    {
      "school": "string",
      "degree": "Bachelor of Science|Master of Science|PhD|Associate|Bachelor of Arts|Master of Arts|etc",
      "field": "string",
      "graduationDate": "MM/YYYY",
      "gpa": "number or null"
    }
  ],
  "skills": ["array", "of", "strings"] or [],
  "certifications": [
    {
      "name": "string",
      "issuer": "string",
      "issueDate": "MM/YYYY or null",
      "expirationDate": "MM/YYYY or null"
    }
  ] or [],
  "languages": [
    {
      "language": "string",
      "proficiency": "Native|Fluent|Professional|Basic"
    }
  ] or []
}`
        });

        const result = await session.prompt(`Parse this resume and return ONLY the JSON object (no markdown, no explanation):\n\n${text}`);

        // Clean up result
        let cleanedResult = result.trim();
        if (cleanedResult.startsWith('```')) {
          cleanedResult = cleanedResult.replace(/```json\n?/g, '').replace(/```\n?/g, '');
        }

        const parsed = JSON.parse(cleanedResult);

        displayResults(parsed, text, filename);
        showStatus('uploadStatus', '✅ Parsing complete!', 'success');

      } catch (error) {
        console.error('Parsing error:', error);
        showStatus('uploadStatus', `⚠️ ${error.message}`, 'error');

        // Show raw text anyway
        displayResults(null, text, filename);
      }
    }

    // Display results
    function displayResults(data, rawText, filename) {
      document.getElementById('results').style.display = 'block';

      // Show stats
      if (data) {
        const stats = {
          fields: countFields(data),
          jobs: data.workExperience?.length || 0,
          degrees: data.education?.length || 0,
          skills: data.skills?.length || 0
        };

        document.getElementById('stats').innerHTML = `
          <div class="stat-card">
            <div class="number">${stats.fields}</div>
            <div class="label">Fields Extracted</div>
          </div>
          <div class="stat-card">
            <div class="number">${stats.jobs}</div>
            <div class="label">Work Experiences</div>
          </div>
          <div class="stat-card">
            <div class="number">${stats.degrees}</div>
            <div class="label">Education Entries</div>
          </div>
          <div class="stat-card">
            <div class="number">${stats.skills}</div>
            <div class="label">Skills</div>
          </div>
        `;

        // Syntax highlight JSON
        document.getElementById('jsonOutput').innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));
      } else {
        document.getElementById('stats').innerHTML = `
          <div class="stat-card">
            <div class="number">N/A</div>
            <div class="label">AI Not Available</div>
          </div>
        `;
        document.getElementById('jsonOutput').textContent = 'Chrome AI not available. Enable it in chrome://flags';
      }

      // Show raw text preview
      document.getElementById('rawText').textContent = rawText.substring(0, 1000) + (rawText.length > 1000 ? '...' : '');

      // Scroll to results
      document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }

    // Count extracted fields
    function countFields(data) {
      let count = 0;
      if (data.personal) {
        count += Object.values(data.personal).filter(v => v !== null).length;
      }
      if (data.summary) count++;
      if (data.workExperience) count += data.workExperience.length * 5;
      if (data.education) count += data.education.length * 4;
      if (data.skills) count += data.skills.length;
      if (data.certifications) count += data.certifications.length * 3;
      if (data.languages) count += data.languages.length * 2;
      return count;
    }

    // Syntax highlight JSON
    function syntaxHighlight(json) {
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) {
            cls = 'json-key';
          } else {
            cls = 'json-string';
          }
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    // Show status message
    function showStatus(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status ${type}`;
    }

    // Check Chrome AI availability
    async function checkAIAvailability() {
      const statusEl = document.getElementById('aiStatus');

      try {
        if (window.ai && window.ai.languageModel) {
          const capabilities = await window.ai.languageModel.capabilities();

          if (capabilities.available === 'readily') {
            statusEl.innerHTML = '✅ <strong>Chrome AI Ready:</strong> Gemini Nano is loaded and ready to parse resumes!';
            statusEl.className = 'ai-status ready';
          } else if (capabilities.available === 'after-download') {
            statusEl.innerHTML = '⏳ <strong>AI Model Downloading:</strong> Chrome is downloading Gemini Nano. This may take a few minutes.';
            statusEl.className = 'ai-status';
          } else {
            statusEl.innerHTML = '⚠️ <strong>AI Not Available:</strong> Enable Chrome AI in <a href="chrome://flags/#prompt-api-for-gemini-nano" target="_blank">chrome://flags</a>';
            statusEl.className = 'ai-status';
          }
        } else {
          statusEl.innerHTML = '⚠️ <strong>Chrome AI Not Supported:</strong> Please use Chrome 127+ (Canary/Dev/Beta). <a href="https://developer.chrome.com/docs/ai/get-started" target="_blank">Learn more</a>';
          statusEl.className = 'ai-status';
        }
      } catch (error) {
        statusEl.innerHTML = '⚠️ <strong>AI Check Failed:</strong> Using fallback parser.';
        statusEl.className = 'ai-status';
      }
    }

    // Load sample resume
    async function loadSampleResume(type) {
      const filename = type === 'workday' ? 'resume-workday.pdf' : 'resume-zillow-2.pdf';
      showStatus('sampleStatus', `Loading ${filename}...`, 'info');

      try {
        // Fetch the sample file
        const response = await fetch(`Resume Samples/${filename}`);
        if (!response.ok) throw new Error('File not found');

        const blob = await response.blob();
        const file = new File([blob], filename, { type: 'application/pdf' });

        await processFile(file);
        showStatus('sampleStatus', '', '');
      } catch (error) {
        showStatus('sampleStatus', `❌ Error loading sample: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
